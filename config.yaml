server:
  host: "0.0.0.0"
  port: 8080

database:
  # sqlite (default, no external service) or postgres (Supabase/Neon/RDS).
  driver: sqlite
  # Used when driver = sqlite
  path: "iroom.db"
  # Used when driver = postgres. Override with DATABASE_URL / SUPABASE_DB_URL.
  url: ""
  # Postgres connection pool (ignored by sqlite, which uses a single conn)
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 0

jwt:
  secret: "change-me-in-production-use-random-string"
  access_expiry: 15
  refresh_expiry: 10080

upload:
  max_size: 52428800
  upload_dir: "uploads"

external:
  api_key: "change-me-external-api-key"

smtp:
  host: "smtp.gmail.com"
  port: 587
  username: ""
  password: ""
  from: "noreply@iroom.ir"
  enabled: false

webrtc:
  public_ip: ""
  stun_port: 3478
  turn_port: 3479
  turn_secret: ""
  udp_port: 8081
